---
# zot container image.
zot_image: 'ghcr.io/project-zot/zot-linux-amd64:v2.1.22'

# Podman and systemd behaviour.
zot_pull_policy: 'newer'
zot_quadlet_options: []

# Host uri on which the registry is published on the host.
zot_listen_uri: '127.0.0.1:5000'

# Static host directory containing the generated zot config. For non-root
# deployments the directory is created and owned by the zot user.
zot_config_dir: '/etc/zot'

# User managed zot configuration. The minimal configuration defined in
# vars/main.yml is recursively merged on top of it, so role-managed keys take
# precedence.
# See https://zotregistry.dev/v2.1.22/admin-guide/admin-configuration/ for
# more details on how to configure zot.
zot_config: {}

# Account that owns the configuration directory and runs the container. The
# role creates it if it does not exist. Set to 'root' for a system-scoped deployment.
zot_user_account: 'zot'

# Log level for zot, written to log.level in the generated configuration.
zot_log_level: 'info'

# Maximum time zot may spend reading a request (including blob uploads) and
# writing a response (including blob downloads), as a Go duration string. zot
# defaults to 60s for both, which aborts any large blob transfer that takes
# longer than a minute. Set either value to '0s' to disable that timeout.
zot_http_read_timeout: '30m'
zot_http_write_timeout: '30m'

# Apache httpd reverse proxy. The role never installs Apache; enable this to
# add a vhost to a pre-existing installation. The layout matches the
# netboot_server role, so both roles can share one httpd instance. The vhost
# always serves the registry over HTTPS and redirects HTTP to it.
zot_apache_vhost: false

# Fully qualified hostname of the registry. It must differ from the hostname
# of other vhosts on the same server, such as netboot_server_name.
zot_apache_server_name: "{{ ansible_facts['fqdn'] }}"

# Certificate and key used by the HTTPS vhost.
zot_apache_cert: '/etc/ssl/server.crt'
zot_apache_key: '/etc/ssl/server.key'
zot_apache_hsts: false

# URL under which Apache can reach zot, used as the reverse proxy target.
zot_apache_backend_url: "http://{{ zot_listen_uri }}"

# Socket timeout in seconds for the proxied connection to zot. Keep it at
# least as large as zot_http_read_timeout and zot_http_write_timeout so Apache
# does not abort a large blob transfer before zot does. Without this, httpd
# falls back to its 60 second TimeOut.
zot_apache_proxy_timeout: 1800

# File name of the vhost configuration, without the .conf extension.
zot_apache_vhost_name: 'zot'

# Local zot users for htpasswd authentication. Each entry needs a name and a
# password; the passwords are hashed and written to /etc/zot/htpasswd, which is
# created even when this list is empty so the minimal configuration can always
# reference it. Keep the passwords in an encrypted variable source such as
# Ansible Vault.
zot_htpasswd_users: []
# - name: 'alice'
#   password: 'change-me'

# When enabled, no_log is disabled on tasks that may expose secrets in their
# output. Only enable this temporarily while troubleshooting.
zot_debug: false
