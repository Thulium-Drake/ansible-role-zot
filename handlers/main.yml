---
# A handler cannot be a block: a named block is not registered as a handler,
# and notifying its name matches a task inside it instead. These handlers
# share the 'Reload Apache httpd' listen topic so all steps run in order.
- name: 'Check whether Apache httpd is running'
  become: true
  ansible.builtin.service_facts:
  changed_when: false
  check_mode: false
  listen: 'Reload Apache httpd'

# The role does not install Apache: the vhost may be written before httpd
# exists. Only validate and reload a running instance. This httpd is shared
# with other vhosts, so an invalid generated file must not be loaded.
- name: 'Validate Apache httpd configuration'
  become: true
  ansible.builtin.command:
    cmd: 'apachectl configtest'
  changed_when: false
  when:
    - (zot_apache_service ~ '.service') in (ansible_facts['services'] | default({}))
    - ansible_facts['services'][zot_apache_service ~ '.service']['state'] == 'running'
  listen: 'Reload Apache httpd'

- name: 'Reload Apache httpd'
  become: true
  ansible.builtin.service:
    name: "{{ zot_apache_service }}"
    state: 'reloaded'
  when:
    - (zot_apache_service ~ '.service') in (ansible_facts['services'] | default({}))
    - ansible_facts['services'][zot_apache_service ~ '.service']['state'] == 'running'
  listen: 'Reload Apache httpd'

- name: 'Restart zot'
  ansible.builtin.systemd:
    name: 'zot'
    state: 'restarted'
    daemon_reload: true
    scope: "{{ (zot_user_account != 'root') | ternary('user', 'system') }}"
  become: "{{ (zot_effective_user['stdout'] != zot_user_account) | bool }}"
  become_user: "{{ zot_user_account }}"
