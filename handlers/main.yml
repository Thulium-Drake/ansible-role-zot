---
- name: 'Reload Apache httpd'
  become: true
  block:
    - name: 'Gather service state'
      ansible.builtin.service_facts:

    # Validate before reloading so an invalid vhost does not take the running
    # Apache instance down.
    - name: 'Validate Apache httpd configuration'
      ansible.builtin.command:
        cmd: 'apachectl configtest'
      changed_when: false

    - name: 'Reload Apache httpd'
      ansible.builtin.service:
        name: "{{ zot_apache_service }}"
        state: 'reloaded'
      when:
        - (zot_apache_service ~ '.service') in ansible_facts.services
        - ansible_facts.services[zot_apache_service ~ '.service']['state'] == 'running'

- name: 'Restart zot'
  ansible.builtin.systemd:
    name: 'zot'
    state: 'restarted'
    daemon_reload: true
    scope: "{{ (zot_user_account != 'root') | ternary('user', 'system') }}"
  become: "{{ (zot_effective_user['stdout'] != zot_user_account) | bool }}"
  become_user: "{{ zot_user_account }}"
