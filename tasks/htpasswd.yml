---
# zot only supports bcrypt and SHA-256/SHA-512 crypt hashes in htpasswd files.
# openssl avoids a dependency on httpd-tools/apache2-utils, and a salt derived
# from the user name keeps repeated runs idempotent.
- name: 'Generate htpasswd hashes'
  ansible.builtin.command:
    cmd: >-
      openssl passwd -6
      -salt {{ (item['name'] | hash('sha256'))[:16] }}
      -stdin
    stdin: "{{ item['password'] | string }}"
  register: 'zot_htpasswd_hashes'
  changed_when: false
  loop: "{{ zot_htpasswd_users }}"
  loop_control:
    label: "{{ item['name'] }}"
  no_log: true

- name: 'Write htpasswd file'
  ansible.builtin.copy:
    content: |
      # This file is managed by Ansible, YOUR CHANGES WILL BE LOST!
      {% for result in zot_htpasswd_hashes['results'] %}
      {{ result['item']['name'] }}:{{ result['stdout'] }}
      {% endfor %}
    dest: '/etc/zot/htpasswd'
    mode: '0640'
  when: zot_htpasswd_users | length > 0
  no_log: true

# copy treats an empty content string as unset, so an empty htpasswd file is
# written with a newline to keep the path valid for the minimal configuration.
- name: 'Ensure empty htpasswd file'
  ansible.builtin.copy:
    content: "\n"
    dest: '/etc/zot/htpasswd'
    mode: '0640'
  when: zot_htpasswd_users | length == 0
  no_log: true
