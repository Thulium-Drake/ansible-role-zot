---
- name: 'Initialise sync credentials mapping'
  ansible.builtin.set_fact:
    zot_sync_credentials_mapping: {}
  no_log: true

- name: 'Build sync credentials mapping'
  ansible.builtin.set_fact:
    zot_sync_credentials_mapping: >-
      {{
        zot_sync_credentials_mapping | combine({
          item['registry']: {
            'username': item['username'],
            'password': item['password']
          }
        })
      }}
  loop: "{{ zot_sync_credentials }}"
  loop_control:
    label: "{{ item['registry'] }}"
  no_log: true

# zot reads extensions.sync.credentialsFile as a JSON object keyed by upstream
# registry host. The file is written even when no credentials are configured so
# a credentialsFile referenced from zot_config always exists when zot validates
# its configuration.
- name: 'Write sync credentials file'
  ansible.builtin.copy:
    content: "{{ zot_sync_credentials_mapping | to_nice_json }}\n"
    dest: "{{ zot_sync_credentials_file }}"
    mode: '0640'
  no_log: true
  notify: 'Restart zot'
