---
- name: 'Ensure htpasswd file'
  ansible.builtin.import_tasks: 'htpasswd.yml'

- name: 'Write zot configuration'
  ansible.builtin.copy:
    content: "{{ zot_config | combine(zot_config_minimal, recursive=True) | to_nice_json }}\n"
    dest: "{{ zot_config_dir }}/config.json"
    mode: '0640'
    # Validate the rendered file before it replaces the live configuration. The
    # image entrypoint is /usr/bin/zot, so this runs 'zot verify'.
    validate: >-
      podman run --rm --security-opt label=disable
      --pull={{ zot_pull_policy }}
      -v %s:/etc/zot/config.json:ro
      {{ zot_image }} verify /etc/zot/config.json
  # The HTTP server timeouts are applied at startup and are not hot
  # reloadable, so restart zot when the configuration changes.
  notify: 'Restart zot'

- name: 'Deploy zot container'
  containers.podman.podman_container:
    name: 'zot'
    state: 'quadlet'
    auto_remove: true
    command: "{{ zot_containers['zot']['command'] | default(omit) }}"
    env: "{{ zot_containers['zot']['env'] | default(omit) }}"
    healthcheck: "{{ zot_containers['zot']['healthcheck'] | default(omit) }}"
    healthcheck_interval: "{{ zot_containers['zot']['healthcheck_interval'] | default(omit) }}"
    healthcheck_retries: "{{ zot_containers['zot']['healthcheck_retries'] | default(omit) }}"
    healthcheck_timeout: "{{ zot_containers['zot']['healthcheck_timeout'] | default(omit) }}"
    image: "{{ zot_containers['zot']['image'] }}"
    ports: "{{ zot_containers['zot']['ports'] | default(omit) }}"
    pull: "{{ zot_pull_policy }}"
    quadlet_options: "{{ zot_containers['zot']['quadlet_options'] | default(zot_quadlet_options) }}"
    volume: "{{ zot_containers['zot']['volume'] | default(omit) }}"
  notify: 'Restart zot'
  no_log: "{{ not (zot_debug | bool) }}"

- name: 'Ensure zot service'
  ansible.builtin.systemd:
    name: 'zot'
    state: 'started'
    enabled: true
    daemon_reload: true
    scope: "{{ (zot_user_account != 'root') | ternary('user', 'system') }}"
  no_log: "{{ not (zot_debug | bool) }}"
