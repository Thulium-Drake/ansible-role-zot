---
# Internal role variables. These define the Podman resources and are not
# intended to be overridden by users.
zot_container_port: 5000
zot_data_volume_name: 'zot-data'
zot_data_dir: '/var/lib/zot'
zot_container_config_dir: '/etc/zot'
zot_container_htpasswd_file: "{{ zot_container_config_dir }}/htpasswd"
zot_volume_driver: 'local'

# Platform-specific paths and service name, derived from the OS family.
zot_apache_config_dir: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('/etc/httpd/conf.d', '/etc/apache2/sites-available') }}"
zot_apache_config_enabled_dir: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('/etc/httpd/conf.d', '/etc/apache2/sites-enabled') }}"
zot_apache_log_dir: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('/var/log/httpd', '/var/log/apache2') }}"
zot_apache_service: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('httpd', 'apache2') }}"

# Minimal configuration required for zot to start. These values take
# precedence over user settings from zot_config in tasks/deploy.yml.
zot_config_minimal:
  distSpecVersion: '1.1.1'
  storage:
    rootDirectory: "{{ zot_data_dir }}"
  http:
    address: '0.0.0.0'
    port: "{{ zot_container_port | string }}"
    # zot's own defaults (60s) cover the entire request/response body and
    # abort large blob uploads and downloads, so set them explicitly.
    readTimeout: "{{ zot_http_read_timeout }}"
    writeTimeout: "{{ zot_http_write_timeout }}"
    auth:
      htpasswd:
        path: "{{ zot_container_htpasswd_file }}"
  log:
    level: "{{ zot_log_level }}"

zot_volumes:
  - "{{ zot_data_volume_name }}"

# Container definitions. Dict keys are the resulting container/systemd unit names.
zot_containers:
  zot:
    image: "{{ zot_image }}"
    command: "serve {{ zot_container_config_dir }}/config.json"
    ports:
      - "{{ zot_listen_uri }}:{{ zot_container_port }}"
    volume:
      - "{{ zot_data_volume_name }}:{{ zot_data_dir }}:Z"
      - "{{ zot_config_dir }}:{{ zot_container_config_dir }}:ro,Z"
